<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oil &amp; Gas Asset Kit — 3D Preview</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#121821; --panel2:#182130; --line:#243040;
    --text:#dfe6f0; --muted:#8794a7; --dim:#5d6b80;
    --accent:#e3b21e; --accent2:#3f8fc4; --ok:#4ade80;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}
  body{
    font:13px/1.45 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid;
    grid-template-columns:290px 1fr 330px;
    grid-template-rows:54px 1fr;
    grid-template-areas:"head head head" "side stage info";
    overflow:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:var(--accent2);text-decoration:none}

  /* ---------- header ---------- */
  header{
    grid-area:head;display:flex;align-items:center;gap:18px;padding:0 18px;
    background:linear-gradient(180deg,#141b26,#101620);
    border-bottom:1px solid var(--line);z-index:5;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:.04em}
  .brand svg{width:24px;height:24px;flex:none}
  .brand small{color:var(--muted);font-weight:500;letter-spacing:0}
  .tabs{display:flex;gap:4px;background:#0d121a;border:1px solid var(--line);border-radius:9px;padding:3px}
  .tabs button{padding:6px 16px;border-radius:7px;color:var(--muted);font-weight:600;font-size:12px}
  .tabs button.active{background:var(--panel2);color:var(--text);box-shadow:0 0 0 1px #2b3a4e inset}
  .headstats{margin-left:auto;display:flex;gap:18px;color:var(--muted);font-size:11.5px;
    font-variant-numeric:tabular-nums}
  .headstats b{color:var(--text);font-weight:600}

  /* ---------- sidebar ---------- */
  aside#side{
    grid-area:side;display:flex;flex-direction:column;min-height:0;
    background:var(--panel);border-right:1px solid var(--line);
  }
  .searchwrap{padding:12px 12px 8px;position:relative}
  .searchwrap input{
    width:100%;padding:8px 10px 8px 30px;border-radius:8px;border:1px solid var(--line);
    background:#0d131b;color:var(--text);outline:none;font-size:12.5px;
  }
  .searchwrap input:focus{border-color:#38506e}
  .searchwrap svg{position:absolute;left:20px;top:20px;width:14px;height:14px;color:var(--dim)}
  .chips{display:flex;flex-wrap:wrap;gap:5px;padding:4px 12px 10px;border-bottom:1px solid var(--line)}
  .chip{padding:4px 9px;border-radius:20px;border:1px solid var(--line);color:var(--muted);
    font-size:11px;font-weight:600;white-space:nowrap}
  .chip:hover{color:var(--text);border-color:#35506e}
  .chip.active{background:var(--accent);color:#161a10;border-color:var(--accent)}
  #list{overflow-y:auto;flex:1;padding:6px;scrollbar-width:thin}
  .item{display:flex;align-items:center;gap:10px;padding:6px;border-radius:8px;cursor:pointer;
    border:1px solid transparent}
  .item:hover{background:#17202d}
  .item.active{background:#1b2738;border-color:#2f4762}
  .item img{width:46px;height:46px;border-radius:6px;background:#0d131b;object-fit:cover;flex:none}
  .item .meta{min-width:0;flex:1}
  .item .nm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .id{font-size:10.5px;color:var(--dim);font-family:ui-monospace,Consolas,monospace;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .tier{font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px}
  .empty{color:var(--dim);padding:20px 12px;text-align:center;font-size:12px}

  /* ---------- stage ---------- */
  main#stage{grid-area:stage;position:relative;min-width:0;background:
    radial-gradient(1200px 700px at 50% 15%,#141c28 0%,#0b0e13 65%)}
  canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;left:16px;bottom:16px;color:var(--muted);font-size:11.5px;
    pointer-events:none;line-height:1.7;text-shadow:0 1px 3px #000}
  #hud b{color:var(--text);font-weight:600}
  #toolbar{
    position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;padding:6px;border-radius:12px;
    background:#121a25e6;border:1px solid var(--line);backdrop-filter:blur(10px);
    box-shadow:0 10px 30px #0008;
  }
  .tbtn{padding:7px 11px;border-radius:8px;color:var(--muted);font-size:11.5px;font-weight:600;
    display:flex;align-items:center;gap:6px;white-space:nowrap}
  .tbtn:hover{background:#1c2736;color:var(--text)}
  .tbtn.on{background:var(--accent);color:#191d11}
  .tbtn svg{width:14px;height:14px}
  .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
  .swatches{display:flex;gap:4px;padding:0 2px}
  .sw{width:17px;height:17px;border-radius:50%;border:2px solid transparent;cursor:pointer}
  .sw:hover{transform:scale(1.12)}
  .sw.on{border-color:#fff}
  #loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:#0b0e13cc;z-index:4;flex-direction:column;gap:12px}
  #loading.show{display:flex}
  .spinner{width:30px;height:30px;border:2px solid #2a3a4e;border-top-color:var(--accent);
    border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .prog{width:220px;height:3px;background:#1d2836;border-radius:2px;overflow:hidden}
  .prog i{display:block;height:100%;width:0%;background:var(--accent);transition:width .2s}

  /* ---------- info ---------- */
  aside#info{grid-area:info;background:var(--panel);border-left:1px solid var(--line);
    overflow-y:auto;padding:16px;scrollbar-width:thin}
  .thumb{width:100%;aspect-ratio:1;border-radius:10px;background:#0d131b;object-fit:contain;
    border:1px solid var(--line);margin-bottom:12px}
  h1{font-size:16px;line-height:1.25;margin:0 0 4px;font-weight:650}
  .sub{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--dim);margin-bottom:10px}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .badge{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    padding:3px 7px;border-radius:5px;background:#1d2937;color:var(--muted)}
  .badge.tier{background:#2a2410;color:var(--accent)}
  .badge.role{background:#102a38;color:#7fd4ff}
  .rows{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:12px;
    padding:12px 0;border-top:1px solid var(--line)}
  .rows .k{color:var(--muted)}
  .rows .v{font-variant-numeric:tabular-nums;text-align:right}
  .rows .v.money{color:var(--ok)}
  h2{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
    margin:16px 0 8px;font-weight:700}
  .matlist{display:flex;flex-wrap:wrap;gap:4px}
  .mat{font-size:10px;font-family:ui-monospace,Consolas,monospace;color:var(--muted);
    background:#0f151d;border:1px solid var(--line);border-radius:4px;padding:2px 5px}
  .links{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
  .links a{flex:1;text-align:center;padding:7px;border-radius:7px;border:1px solid var(--line);
    font-size:11.5px;font-weight:600;color:var(--text);background:#0f151d}
  .links a:hover{border-color:#3a567a;background:#151f2c}
  .hint{color:var(--dim);font-size:11.5px;line-height:1.7}
  kbd{background:#0f151d;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;
    padding:1px 5px;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--muted)}

  /* ---------- file:// banner ---------- */
  #filebanner{display:none;position:fixed;left:50%;top:70px;transform:translateX(-50%);
    background:#3a1d1d;border:1px solid #7a3636;color:#ffd7d7;padding:12px 18px;border-radius:10px;
    z-index:50;max-width:640px;font-size:12.5px;line-height:1.6;box-shadow:0 12px 40px #000a}
  #filebanner code{background:#00000055;padding:1px 5px;border-radius:4px}
  #filebanner.show{display:block}

  @media (max-width:1200px){
    body{grid-template-columns:250px 1fr 0}
    aside#info{display:none}
  }
  @media (max-width:820px){
    body{grid-template-columns:0 1fr 0;grid-template-areas:"head head head" "stage stage stage"}
    aside#side{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#e3b21e" stroke-width="1.6">
      <path d="M4 21h16M7 21V9l5-4 5 4v12" stroke-linejoin="round"/>
      <path d="M10 21v-5h4v5M12 3v2" stroke-linejoin="round"/>
    </svg>
    OILFIELD KIT <small id="brandcount"></small>
  </div>
  <nav class="tabs">
    <button data-view="assets" class="active">Assets</button>
    <button data-view="field">Field</button>
  </nav>
  <div class="headstats" id="headstats"></div>
</header>

<aside id="side">
  <div class="searchwrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input id="search" type="search" placeholder="Search assets, roles, ids…" autocomplete="off" spellcheck="false">
  </div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
</aside>

<main id="stage">
  <canvas id="canvas"></canvas>
  <div id="hud"></div>
  <div id="toolbar">
    <button class="tbtn" id="btn-wire" title="Toggle wireframe (W)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M12 3 3 8v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/>
      </svg>Wireframe
    </button>
    <button class="tbtn" id="btn-rotate" title="Auto-rotate">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>
      </svg>Spin
    </button>
    <span class="sep"></span>
    <span class="swatches" id="swatches" title="Team tint (paint_* materials)"></span>
    <span class="sep"></span>
    <button class="tbtn" id="btn-reset" title="Reset camera (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/>
      </svg>Fit
    </button>
    <button class="tbtn" id="btn-shot" title="Download PNG">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/>
      </svg>Shot
    </button>
  </div>
  <div id="loading"><div class="spinner"></div><div id="loadtext">Loading…</div>
    <div class="prog"><i id="progbar"></i></div></div>
</main>

<aside id="info"></aside>

<div id="filebanner">
  <b>Local files blocked.</b> Browsers refuse <code>fetch()</code> and module imports from
  <code>file://</code>. Start the bundled server and open
  <code>http://localhost:8000/preview/</code>.<br>
  <code>powershell -ExecutionPolicy Bypass -File preview\serve.ps1</code>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/"
  }
}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ------------------------------------------------------------------ */
/* constants                                                           */
/* ------------------------------------------------------------------ */
const CAT_LABEL = {
  onshore: 'Onshore', offshore: 'Offshore', midstream: 'Midstream',
  refinery: 'Refinery', vehicles: 'Vehicles', props: 'Props',
};
const GP_ROWS = [
  ['cost_usd', 'Capex', 'money'],
  ['build_days', 'Build time', 'days'],
  ['upkeep_usd_day', 'Upkeep', 'money'],
  ['crew', 'Crew'],
  ['power_kw', 'Power', 'kW'],
  ['capacity_bopd', 'Oil rate', 'bbl/d'],
  ['capacity_bfpd', 'Fluid rate', 'bbl/d'],
  ['capacity_mmscfd', 'Gas rate', 'MMscf/d'],
  ['capacity_bbl', 'Storage', 'bbl'],
  ['capacity_bwpd', 'Water rate', 'bbl/d'],
  ['throughput_bpd', 'Throughput', 'bbl/d'],
  ['capacity_mtpa', 'LNG', 'Mtpa'],
  ['drill_depth_m', 'Max depth', 'm'],
  ['water_depth_max_m', 'Water depth', 'm'],
  ['well_slots', 'Well slots'],
  ['passengers', 'Passengers'],
  ['lift_t', 'Lift', 't'],
  ['speed_kmh', 'Speed', 'km/h'],
  ['speed_kn', 'Speed', 'kn'],
  ['footprint_m2', 'Footprint', 'm²'],
  ['placement', 'Placement'],
];
const TINTS = [
  ['#d8dde3', 'neutral'],
  ['#c8342c', 'red'],
  ['#2f7fc4', 'blue'],
  ['#3f9d63', 'green'],
  ['#e3b21e', 'amber'],
  ['#8b5cc7', 'violet'],
];
const COORD_NOTE = 'glTF Y-up · 1 unit = 1 m · origin at base/waterline';

/* ------------------------------------------------------------------ */
/* dom                                                                 */
/* ------------------------------------------------------------------ */
const $ = (s) => document.querySelector(s);
const canvas = $('#canvas');
const elList = $('#list');
const elInfo = $('#info');
const elChips = $('#chips');
const elHud = $('#hud');
const elLoading = $('#loading');
const elLoadText = $('#loadtext');
const elProg = $('#progbar');
const elBanner = $('#filebanner');

/* ------------------------------------------------------------------ */
/* renderer / scene                                                    */
/* ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x232620);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 60000);

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 0.4;
controls.maxDistance = 30000;

const hemi = new THREE.HemisphereLight(0xbcd4ff, 0x2a2f38, 0.55);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff2dd, 2.6);
key.position.set(420, 900, 620);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0006;
key.shadow.normalBias = 0.02;
scene.add(key);
scene.add(key.target);

const rim = new THREE.DirectionalLight(0x9cc8ff, 0.9);
rim.position.set(-700, 380, -520);
scene.add(rim);

const fill = new THREE.DirectionalLight(0xffd9a8, 0.35);
fill.position.set(-200, -300, 800);
scene.add(fill);

/* ground + water (asset mode) */
const groundGroup = new THREE.Group();
scene.add(groundGroup);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, roughness: 0.95, metalness: 0.0,
});
(function groundGradient() {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(256, 256, 0, 256, 256, 256);
  grad.addColorStop(0.0, '#3d4034');
  grad.addColorStop(0.45, '#2a2d24');
  grad.addColorStop(1.0, '#1c1e18');
  g.fillStyle = grad;
  g.fillRect(0, 0, 512, 512);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  groundMat.map = tex;
})();
const ground = new THREE.Mesh(new THREE.CircleGeometry(1, 64), groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
groundGroup.add(ground);

let grid = new THREE.GridHelper(20, 20, 0x2b3646, 0x1b2431);
grid.material.opacity = 0.55;
grid.material.transparent = true;
groundGroup.add(grid);

const waterMat = new THREE.MeshPhysicalMaterial({
  color: 0x14384a, roughness: 0.08, metalness: 0.1, transparent: true, opacity: 0.82,
  transmission: 0.15, side: THREE.DoubleSide,
});
const water = new THREE.Mesh(new THREE.CircleGeometry(1, 72), waterMat);
water.rotation.x = -Math.PI / 2;
water.position.y = 0;
water.renderOrder = 1;
water.visible = false;
groundGroup.add(water);

/* roots */
const assetRoot = new THREE.Group();
const fieldRoot = new THREE.Group();
const fieldTerrain = new THREE.Group();
const fieldObjects = new THREE.Group();
fieldRoot.add(fieldTerrain, fieldObjects);
fieldRoot.visible = false;
scene.add(assetRoot, fieldRoot);

/* ------------------------------------------------------------------ */
/* state                                                               */
/* ------------------------------------------------------------------ */
const state = {
  manifest: null,
  assets: [],
  byId: new Map(),
  currentId: null,
  view: 'assets',
  wireframe: false,
  spin: false,
  tint: null,
  category: 'all',
  query: '',
  model: null,
  fieldBuilt: false,
  fieldObjects: 0,
};

const loader = new GLTFLoader();
const gltfCache = new Map();

// 3-band cel ramp shared by every asset (matches the Blender preview shader)
const toonRamp = (() => {
  const steps = [96, 170, 224, 255];
  const data = new Uint8Array(steps.length * 4);
  steps.forEach((v, i) => {
    data[i * 4] = v; data[i * 4 + 1] = v; data[i * 4 + 2] = v; data[i * 4 + 3] = 255;
  });
  const tex = new THREE.DataTexture(data, steps.length, 1, THREE.RGBAFormat);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
})();

function toToon(src) {
  const m = new THREE.MeshToonMaterial({
    color: src.color ? src.color.clone() : new THREE.Color(0xaaaaaa),
    gradientMap: toonRamp,
  });
  m.name = src.name || 'mat';
  if (src.emissive && (src.emissiveIntensity || 0) > 0) {
    m.emissive = src.emissive.clone();
    m.emissiveIntensity = Math.min(src.emissiveIntensity, 1.2);
  }
  return m;
}

function loadGLTF(id) {
  if (gltfCache.has(id)) return gltfCache.get(id);
  const a = state.byId.get(id);
  const p = loader.loadAsync(`../assets/glb/${a.category}/${id}.glb`);
  gltfCache.set(id, p);
  return p;
}

function instantiate(gltf, cloneMaterials, toon = true) {
  const root = gltf.scene.clone(true);
  root.traverse((o) => {
    if (!o.isMesh) return;
    if (cloneMaterials) {
      o.material = Array.isArray(o.material) ? o.material.map((m) => m.clone()) : o.material.clone();
    }
    if (toon) {
      o.material = Array.isArray(o.material) ? o.material.map(toToon) : toToon(o.material);
    }
    o.castShadow = true;
    o.receiveShadow = true;
  });
  return root;
}

/* ------------------------------------------------------------------ */
/* ui helpers                                                          */
/* ------------------------------------------------------------------ */
const fmtInt = (v) => (v == null ? '—' : Number(v).toLocaleString());
const fmtMoney = (v) => {
  if (v == null) return '—';
  const n = Number(v);
  if (n >= 1e9) return '$' + (n / 1e9).toFixed(2) + ' bn';
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(1) + ' M';
  if (n >= 1e3) return '$' + Math.round(n / 1e3) + ' k';
  return '$' + n;
};
function niceNum(x) {
  const p = Math.pow(10, Math.floor(Math.log10(Math.max(x, 1e-6))));
  const n = x / p;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * p;
}

/* ------------------------------------------------------------------ */
/* camera fitting                                                      */
/* ------------------------------------------------------------------ */
function fitObject(object, margin = 1.45) {
  const box = new THREE.Box3().setFromObject(object);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z, 0.5);
  const fov = (camera.fov * Math.PI) / 180;
  const dist = (maxDim / (2 * Math.tan(fov / 2))) * margin;
  const dir = new THREE.Vector3(1, 0.62, 1.15).normalize();
  camera.position.copy(center).addScaledVector(dir, dist);
  camera.near = Math.max(0.05, maxDim / 4000);
  camera.far = maxDim * 60 + 500;
  camera.updateProjectionMatrix();
  controls.target.copy(center);
  controls.minDistance = maxDim * 0.12;
  controls.maxDistance = maxDim * 12;
  controls.update();
  return { center, maxDim };
}

function frameGround(maxDim) {
  const r = Math.max(maxDim * 1.8, 1);
  ground.scale.setScalar(r);
  grid.scale.setScalar(1);
  const gridSize = niceNum(maxDim * 5);
  groundGroup.remove(grid);
  grid.geometry.dispose();
  grid = new THREE.GridHelper(gridSize, 20, 0x2b3646, 0x1a2330);
  grid.material.opacity = 0.45;
  grid.material.transparent = true;
  groundGroup.add(grid);
  water.scale.setScalar(Math.max(maxDim * 2.6, 2));
  const s = key.shadow.camera;
  s.left = -maxDim; s.right = maxDim; s.top = maxDim; s.bottom = -maxDim;
  s.near = 0.5; s.far = maxDim * 12;
  s.updateProjectionMatrix();
  key.position.set(maxDim * 1.6, maxDim * 3, maxDim * 2.2);
  key.target.position.set(0, maxDim * 0.3, 0);
  key.target.updateMatrixWorld();
}

/* ------------------------------------------------------------------ */
/* asset view                                                          */
/* ------------------------------------------------------------------ */
function clearAsset() {
  if (state.model) {
    assetRoot.remove(state.model);
    state.model.traverse((o) => {
      if (o.isMesh) {
        o.geometry?.dispose?.();
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach((m) => m?.dispose?.());
      }
    });
    state.model = null;
  }
}

function applyWireframe(root) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach((m) => { if (m) m.wireframe = state.wireframe; });
  });
}

function applyTint(root) {
  root.traverse((o) => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    mats.forEach((m) => {
      if (!m || !m.name || !m.name.startsWith('paint_')) return;
      if (!m.userData._orig) m.userData._orig = m.color.clone();
      if (state.tint) {
        m.color.set(state.tint);
        if ('metalness' in m) m.metalness = 0.0;
        if ('roughness' in m) m.roughness = Math.min(m.roughness ?? 0.6, 0.9);
      } else {
        m.color.copy(m.userData._orig);
      }
      m.needsUpdate = true;
    });
  });
}

function setAssetsUI() {
  state.view = 'assets';
  document.querySelectorAll('.tabs button').forEach((b) => {
    b.classList.toggle('active', b.dataset.view === 'assets');
  });
  assetRoot.visible = true;
  fieldRoot.visible = false;
  groundGroup.visible = true;
  document.querySelector('#toolbar').style.display = '';
}

async function showAsset(id, pushHash = true) {
  const asset = state.byId.get(id);
  if (!asset) return;
  if (state.view !== 'assets') setAssetsUI();
  state.currentId = id;

  document.querySelectorAll('.item').forEach((n) => {
    n.classList.toggle('active', n.dataset.id === id);
  });
  const active = document.querySelector(`.item[data-id="${id}"]`);
  if (active) active.scrollIntoView({ block: 'nearest' });

  elLoading.classList.add('show');
  elLoadText.textContent = 'Loading ' + asset.name;
  elProg.style.width = '30%';

  try {
    const gltf = await loadGLTF(id);
    elProg.style.width = '75%';
    clearAsset();
    const root = instantiate(gltf, true);
    assetRoot.add(root);
    state.model = root;

    const info = fitObject(root);
    frameGround(info.maxDim);

    const isWater = asset.gameplay?.placement === 'waterline';
    water.visible = isWater;
    if (isWater) {
      water.scale.setScalar(Math.max(info.maxDim * 2.4, 4));
    }
    applyWireframe(root);
    applyTint(root);
    renderInfo(asset);
    const dims = (asset.geometry?.size_m || []).map((v) => (+v).toFixed(1)).join(' × ');
    elHud.innerHTML = `<b>${asset.name}</b><br>${fmtInt(asset.geometry?.triangles)} tris · ${dims} m`;

    if (pushHash) location.hash = '#/asset/' + id;
  } catch (err) {
    console.error(err);
    elLoadText.textContent = 'Failed to load ' + id;
  } finally {
    elProg.style.width = '100%';
    setTimeout(() => elLoading.classList.remove('show'), 120);
  }
}

function renderInfo(a) {
  const g = a.gameplay || {};
  const geo = a.geometry || {};
  const rows = [];
  const tier = g.tier != null ? `T${g.tier}` : '';
  const seen = new Set();
  for (const [k, label, unit] of GP_ROWS) {
    if (g[k] == null || g[k] === '') continue;
    if (seen.has(k)) continue;
    seen.add(k);
    let v;
    if (k === 'placement') v = String(g[k]);
    else if (k === 'cost_usd' || k === 'upkeep_usd_day') v = fmtMoney(g[k]) + (k === 'upkeep_usd_day' ? ' /day' : '');
    else v = fmtInt(g[k]) + (unit ? ' ' + unit : '');
    rows.push(`<div class="k">${label}</div><div class="v ${k === 'cost_usd' ? 'money' : ''}">${v}</div>`);
  }
  const mats = (geo.materials || []).map((m) => `<span class="mat">${m}</span>`).join('');
  const dims = (geo.size_m || []).map((v) => (+v).toFixed(1)).join(' × ');

  elInfo.innerHTML = `
    <img class="thumb" src="../${a.files?.preview || ''}" alt="${a.name}">
    <h1>${a.name}</h1>
    <div class="sub">${a.id}</div>
    <div class="badges">
      <span class="badge">${CAT_LABEL[a.category] || a.category}</span>
      ${tier ? `<span class="badge tier">${tier}</span>` : ''}
      ${g.role ? `<span class="badge role">${g.role}</span>` : ''}
    </div>
    <div class="rows">${rows.join('')}</div>
    <h2>Geometry</h2>
    <div class="rows">
      <div class="k">Triangles</div><div class="v">${fmtInt(geo.triangles)}</div>
      <div class="k">LODs</div><div class="v">${(geo.lod_triangles || []).map(fmtInt).join(' → ') || '—'}</div>
      <div class="k">Size X × Y × Z</div><div class="v">${dims || '—'} m</div>
      <div class="k">Material slots</div><div class="v">${(geo.materials || []).length}</div>
    </div>
    <h2>Materials</h2>
    <div class="matlist">${mats}</div>
    <div class="links">
      <a href="../${a.files?.glb || ''}" download>GLB</a>
      <a href="../${a.files?.fbx || ''}" download>FBX</a>
      <a href="../${a.files?.preview || ''}" target="_blank">PNG</a>
    </div>
    <h2>Notes</h2>
    <div class="hint">
      ${COORD_NOTE}.<br>
      ${g.placement === 'waterline' ? 'Floating asset — the sea plane marks the waterline (y = 0).' : ''}
      ${g.placement === 'seabed' ? 'Seabed asset — place on the seafloor.' : ''}
      ${!g.placement ? 'Origin sits on the ground plane.' : ''}
      <br>Press <kbd>W</kbd> wireframe · <kbd>F</kbd> fit · <kbd>←</kbd><kbd>→</kbd> browse.
    </div>`;
}

/* ------------------------------------------------------------------ */
/* field view                                                          */
/* ------------------------------------------------------------------ */
async function buildField() {
  if (state.fieldBuilt) return;
  elLoading.classList.add('show');
  elLoadText.textContent = 'Loading field layout…';
  elProg.style.width = '5%';

  const layout = await (await fetch('../assets/json/demo_layout.json')).json();
  const objects = layout.objects || [];
  const ids = [...new Set(objects.map((o) => o.id))];

  let done = 0;
  await Promise.all(ids.map(async (id) => {
    try { await loadGLTF(id); } catch (e) { console.warn('missing', id); }
    done++;
    elProg.style.width = Math.round((done / ids.length) * 80) + '%';
    elLoadText.textContent = `Loading assets ${done} / ${ids.length}`;
  }));

  /* terrain */
  const COLORS = { grass: 0x55603e, sand: 0xc6b393, water: 0x1b4a5f };
  for (const key of ['land', 'shore']) {
    const t = layout.terrain?.[key];
    if (!t) continue;
    const geo = new THREE.PlaneGeometry(t.size[0], t.size[1]);
    const mat = new THREE.MeshStandardMaterial({
      color: COLORS[t.plane] ?? 0x444444, roughness: 0.95, metalness: 0,
    });
    const m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;
    m.position.set(t.center[0], t.z ?? 0, -t.center[1]);
    m.receiveShadow = true;
    fieldTerrain.add(m);
  }
  const sea = layout.terrain?.sea;
  if (sea) {
    const geo = new THREE.PlaneGeometry(sea.size[0], sea.size[1]);
    const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: COLORS.water, roughness: 0.12, metalness: 0.25,
      transparent: true, opacity: 0.9,
    }));
    m.rotation.x = -Math.PI / 2;
    m.position.set(sea.center[0], sea.z ?? 0, -sea.center[1]);
    fieldTerrain.add(m);
  }

  /* objects: Blender (x,y,z) -> glTF (x, z, -y) */
  let placed = 0;
  for (const o of objects) {
    const cached = gltfCache.get(o.id);
    if (!cached) continue;
    let gltf;
    try { gltf = await cached; } catch { continue; }
    const inst = instantiate(gltf, false);
    inst.position.set(o.x, o.z ?? 0, -o.y);
    inst.rotation.y = ((o.rot || 0) * Math.PI) / 180;
    fieldObjects.add(inst);
    placed++;
  }
  state.fieldObjects = placed;
  state.fieldBuilt = true;

  /* camera fitted to the placed objects (not the terrain) for the current aspect */
  fitFieldBox();
  controls.minDistance = 20;
  controls.maxDistance = 9000;
  controls.update();

  key.position.set(700, 1500, 900);
  key.target.position.set(0, 0, 0);
  key.target.updateMatrixWorld();
  const s = key.shadow.camera;
  s.left = -900; s.right = 900; s.top = 900; s.bottom = -900;
  s.near = 1; s.far = 4000;
  s.updateProjectionMatrix();

  renderFieldInfo(layout, placed);
  elHud.innerHTML = `<b>${placed}</b> objects placed · drag to orbit · scroll to zoom`;
  elProg.style.width = '100%';
  setTimeout(() => elLoading.classList.remove('show'), 150);
}

/* iterative projected-bounds fit — adapts to the real canvas aspect ratio */
function fitFieldBox(margin = 0.83) {
  const box = new THREE.Box3().setFromObject(fieldObjects);
  if (box.isEmpty()) return;
  const center = box.getCenter(new THREE.Vector3());
  const dir = new THREE.Vector3(160, 620, 1200).normalize();
  camera.near = 1;
  camera.far = 40000;
  camera.updateProjectionMatrix();
  const corners = [];
  for (const x of [box.min.x, box.max.x])
    for (const y of [box.min.y, box.max.y])
      for (const z of [box.min.z, box.max.z])
        corners.push(new THREE.Vector3(x, y, z));

  let dist = 1800;
  for (let i = 0; i < 7; i++) {
    camera.position.copy(center).addScaledVector(dir, dist);
    camera.lookAt(center);
    camera.updateMatrixWorld(true);
    let mx = 0, my = 0;
    for (const c of corners) {
      const p = c.clone().project(camera);
      mx = Math.max(mx, Math.abs(p.x));
      my = Math.max(my, Math.abs(p.y));
    }
    const f = Math.max(mx, my) / margin;
    if (!isFinite(f) || Math.abs(f - 1) < 0.02) break;
    dist *= f;
  }
  camera.position.copy(center).addScaledVector(dir, dist);
  camera.lookAt(center);
  controls.target.copy(center);
}

function renderFieldInfo(layout, placed) {
  const counts = {};
  for (const o of layout.objects) {
    const a = state.byId.get(o.id);
    if (a) counts[a.category] = (counts[a.category] || 0) + 1;
  }
  const rows = Object.keys(CAT_LABEL)
    .filter((c) => counts[c])
    .map((c) => `<div class="k">${CAT_LABEL[c]}</div><div class="v">${counts[c]}</div>`)
    .join('');
  elInfo.innerHTML = `
    <h1>Development Field</h1>
    <div class="sub">assets/json/demo_layout.json</div>
    <div class="badges">
      <span class="badge">${placed} objects</span>
      <span class="badge tier">demo layout</span>
    </div>
    <p class="hint">A whole basin assembled from the kit — onshore drilling and
      production, trunkline, gas plant, LNG, refinery cluster, marine terminal and
      offshore cluster — to show how the pieces compose at map scale.</p>
    <h2>Objects by category</h2>
    <div class="rows">${rows}</div>
    <h2>Controls</h2>
    <div class="hint">
      Drag = orbit · scroll = zoom · right-drag = pan.<br>
      Pick any asset in the list to inspect it in 3D.<br><br>
      The layout is generated by <code>blender/demo_scene.py</code>, so edits to the
      Blender scene propagate to this view on the next build.
    </div>`;
}

/* ------------------------------------------------------------------ */
/* view switching                                                      */
/* ------------------------------------------------------------------ */
function setView(view, pushHash = true) {
  if (view === 'assets') {
    setAssetsUI();
    if (state.currentId) showAsset(state.currentId, false);
    if (pushHash) location.hash = '#/asset/' + (state.currentId || '');
    return;
  }

  state.view = 'field';
  document.querySelectorAll('.tabs button').forEach((b) => {
    b.classList.toggle('active', b.dataset.view === 'field');
  });
  assetRoot.visible = false;
  fieldRoot.visible = true;
  groundGroup.visible = false;
  document.querySelector('#toolbar').style.display = 'none';

  elHud.innerHTML = 'Loading field…';
  buildField().catch((e) => { console.error(e); elHud.textContent = 'Field failed to load'; });
  if (pushHash) location.hash = '#/field';
}

/* ------------------------------------------------------------------ */
/* sidebar                                                             */
/* ------------------------------------------------------------------ */
function renderChips() {
  const counts = {};
  for (const a of state.assets) counts[a.category] = (counts[a.category] || 0) + 1;
  const cats = ['all', ...Object.keys(CAT_LABEL).filter((c) => counts[c])];
  elChips.innerHTML = cats.map((c) => {
    const n = c === 'all' ? state.assets.length : counts[c];
    return `<button class="chip ${state.category === c ? 'active' : ''}" data-cat="${c}">
      ${c === 'all' ? 'All' : CAT_LABEL[c]} <span style="opacity:.55">${n}</span></button>`;
  }).join('');
  elChips.querySelectorAll('.chip').forEach((b) => {
    b.onclick = () => { state.category = b.dataset.cat; renderChips(); renderList(); };
  });
}

function renderList() {
  const q = state.query.trim().toLowerCase();
  const items = state.assets.filter((a) => {
    if (state.category !== 'all' && a.category !== state.category) return false;
    if (!q) return true;
    const hay = [a.id, a.name, a.category, a.gameplay?.role, a.gameplay?.tier].join(' ').toLowerCase();
    return hay.includes(q);
  });

  if (!items.length) {
    elList.innerHTML = '<div class="empty">No assets match.</div>';
    return;
  }
  elList.innerHTML = items.map((a) => `
    <div class="item ${a.id === state.currentId ? 'active' : ''}" data-id="${a.id}">
      <img loading="lazy" src="../${a.files?.preview || ''}" alt="">
      <div class="meta">
        <div class="nm">${a.name}</div>
        <div class="id">${a.id}</div>
      </div>
      ${a.gameplay?.tier ? `<span class="tier">T${a.gameplay.tier}</span>` : ''}
    </div>`).join('');
  elList.querySelectorAll('.item').forEach((n) => {
    n.onclick = () => showAsset(n.dataset.id);
  });
}

/* ------------------------------------------------------------------ */
/* toolbar                                                             */
/* ------------------------------------------------------------------ */
$('#swatches').innerHTML = TINTS.map(([hex, name], i) =>
  `<button class="sw ${i === 0 ? 'on' : ''}" data-hex="${i === 0 ? '' : hex}" title="${name}"
     style="background:${hex}"></button>`).join('');

$('#swatches').querySelectorAll('.sw').forEach((b) => {
  b.onclick = () => {
    state.tint = b.dataset.hex || null;
    $('#swatches').querySelectorAll('.sw').forEach((x) => x.classList.toggle('on', x === b));
    if (state.model) applyTint(state.model);
  };
});

$('#btn-wire').onclick = () => {
  state.wireframe = !state.wireframe;
  $('#btn-wire').classList.toggle('on', state.wireframe);
  if (state.model) applyWireframe(state.model);
  if (state.fieldBuilt) applyWireframe(fieldRoot);
};
$('#btn-rotate').onclick = () => {
  state.spin = !state.spin;
  $('#btn-rotate').classList.toggle('on', state.spin);
  controls.autoRotate = state.spin;
  controls.autoRotateSpeed = 0.9;
};
$('#btn-reset').onclick = () => {
  if (state.view === 'assets' && state.model) fitObject(state.model);
  else if (state.view === 'field') {
    fitFieldBox();
    controls.update();
  }
};
$('#btn-shot').onclick = () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = (state.currentId || 'oilfield') + '.png';
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
};

$('#search').oninput = (e) => { state.query = e.target.value; renderList(); };

document.querySelectorAll('.tabs button').forEach((b) => {
  b.onclick = () => setView(b.dataset.view);
});

addEventListener('keydown', (e) => {
  if (e.target.matches('input, textarea')) return;
  if (e.key === 'w' || e.key === 'W') $('#btn-wire').click();
  if (e.key === 'f' || e.key === 'F') $('#btn-reset').click();
  if (state.view !== 'assets') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const list = [...elList.querySelectorAll('.item')];
    const i = list.findIndex((n) => n.dataset.id === state.currentId);
    if (i < 0) return;
    const j = (i + (e.key === 'ArrowRight' ? 1 : -1) + list.length) % list.length;
    showAsset(list[j].dataset.id);
  }
});

/* ------------------------------------------------------------------ */
/* resize + loop                                                       */
/* ------------------------------------------------------------------ */
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas);

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
});

/* ------------------------------------------------------------------ */
/* boot                                                                */
/* ------------------------------------------------------------------ */
async function boot() {
  if (location.protocol === 'file:') {
    elBanner.classList.add('show');
    return;
  }
  try {
    const man = await (await fetch('../assets/json/manifest.json')).json();
    state.manifest = man;
    state.assets = man.assets.slice().sort((a, b) => a.id.localeCompare(b.id));
    state.byId = new Map(state.assets.map((a) => [a.id, a]));

    $('#brandcount').textContent = `${man.totals.assets} assets`;
    $('#headstats').innerHTML = `
      <span><b>${man.totals.assets}</b> assets</span>
      <span><b>${fmtInt(man.totals.triangles)}</b> tris</span>
      <span><b>${man.totals.categories}</b> categories</span>
      <span>Blender ${man.blender_version.split(' ')[0]}</span>`;

    renderChips();
    renderList();
    resize();

    const m = location.hash.match(/#\/asset\/([a-z0-9_]+)/i);
    const first = (m && state.byId.has(m[1])) ? m[1] : state.assets[0]?.id;
    if (location.hash === '#/field') {
      setView('field');
    } else if (first) {
      showAsset(first, false);
    }
    if (!location.hash) location.hash = '#/asset/' + first;
  } catch (err) {
    console.error(err);
    elBanner.classList.add('show');
  }
}
boot();
</script>
